name: Check a ci.erlang.mk project

on:
  workflow_call:

env:
  CI_ERLANG_MK: 1
  AUTO_CI_MASTER: weekly
  COWBOY_QUICER: ${{ vars.COWBOY_QUICER || 0 }}
  GUN_QUICER: ${{ vars.GUN_QUICER || 0 }}
  CORRAL_DEPS: ${{ vars.CORRAL_DEPS || ' ' }}

jobs:

  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      erlang: ${{ steps.versions.outputs.erlang }}
      freebsd: ${{ steps.freebsd_versions.outputs.freebsd }}
      latest: ${{ steps.latest_version.outputs.latest }}
    steps:

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Checkout ci.erlang.mk repository
      uses: actions/checkout@v4
      with:
        repository: ninenines/ci.erlang.mk
        path: deps/ci.erlang.mk

    - name: Output Erlang/OTP versions
      id: versions
      run: |
        {
          echo "erlang<<EOF"
          make ci-list | jq -Rn '[inputs]'
          echo EOF
        } >> "$GITHUB_OUTPUT"

    - name: Output FreeBSD Erlang/OTP versions
      id: freebsd_versions
      run: |
        {
          echo "freebsd<<EOF"
          make ci-list | sed -n 's/^OTP-\([0-9][0-9]*\).*/\1/p' | awk '!seen[$0]++' | jq -Rn '[inputs]'
          echo EOF
        } >> "$GITHUB_OUTPUT"

    - name: Output latest Erlang/OTP version
      id: latest_version
      run: |
        {
          echo "latest<<EOF"
          make ci-list | grep -v rc | grep -v master | tail -n1
          echo EOF
        } >> "$GITHUB_OUTPUT"

  dialyze:
    name: Dialyzer (${{ needs.prepare.outputs.latest }})
    needs: prepare
    runs-on: ubuntu-latest
    steps:

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Erlang/OTP
      uses: erlef/setup-beam@v1
      with:
        otp-version: '${{ needs.prepare.outputs.latest }}'
        version-type: strict

    - name: Checkout ci.erlang.mk repository
      uses: actions/checkout@v4
      with:
        repository: ninenines/ci.erlang.mk
        path: deps/ci.erlang.mk

    - name: Run Dialyzer
      run: make dialyze

  test-unix:
    name: Tests
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        erlang: ${{ fromJson(needs.prepare.outputs.erlang) }}
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Erlang/OTP
      uses: erlef/setup-beam@v1
      with:
        otp-version: '${{ matrix.erlang }}'
        version-type: strict

    - name: Checkout ci.erlang.mk repository
      uses: actions/checkout@v4
      with:
        repository: ninenines/ci.erlang.mk
        path: deps/ci.erlang.mk

    - name: Run tests (macOS)
      if: runner.os == 'macOS'
      run: >
        brew install coreutils make &&
        gmake -k ci-setup tests

    - name: Run tests (Unix)
      if: runner.os != 'macOS'
      run: make -k ci-setup tests

    - name: Upload logs
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Common Test logs (${{ matrix.erlang }} ${{ runner.os }})
        path: |
          logs/
#          !logs/**/log_private

  test-windows:
    name: Tests
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        erlang: ${{ fromJson(needs.prepare.outputs.erlang) }}
        os: [windows-latest]
        exclude:
          # Windows doesn't have master builds.
          - erlang: master
            os: windows-latest
    runs-on: ${{ matrix.os }}
    env:
      COWBOY_QUICER: 0
      GUN_QUICER: 0
      CORRAL_DEPS: quic
    steps:

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Erlang/OTP
      uses: erlef/setup-beam@v1
      with:
        otp-version: '${{ matrix.erlang }}'
        version-type: loose

    - name: Checkout ci.erlang.mk repository
      uses: actions/checkout@v4
      with:
        repository: ninenines/ci.erlang.mk
        path: deps/ci.erlang.mk

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: mingw64
        update: true
        install: >-
          git
          make

    - name: Run tests
      shell: msys2 {0}
      run: PATH=$INSTALL_DIR_FOR_OTP/bin:$PATH make -k ci-setup tests

    - name: Upload logs
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Common Test logs (${{ matrix.erlang }} ${{ runner.os }})
        path: |
          logs/
#          !logs/**/log_private

  test-freebsd:
    name: Tests
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        erlang: ${{ fromJson(needs.prepare.outputs.freebsd) }}
        os: [freebsd-15.1]
    runs-on: ubuntu-latest
    steps:

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Checkout ci.erlang.mk repository
      uses: actions/checkout@v4
      with:
        repository: ninenines/ci.erlang.mk
        path: deps/ci.erlang.mk

    - name: Install problem matchers
      run: echo "::add-matcher::deps/ci.erlang.mk/.github/matchers/erlang-matchers.json"

    - name: Select FreeBSD release
      id: freebsd
      run: |
        release='${{ matrix.os }}'
        echo "os=${release%%-*}" >> "$GITHUB_OUTPUT"
        echo "version=${release#*-}" >> "$GITHUB_OUTPUT"

    - name: Run tests (FreeBSD)
      uses: cross-platform-actions/action@v1
      with:
        operating_system: ${{ steps.freebsd.outputs.os }}
        version: ${{ steps.freebsd.outputs.version }}
        environment_variables: CI_ERLANG_MK AUTO_CI_MASTER COWBOY_QUICER GUN_QUICER CORRAL_DEPS
        run: |
          sudo pkg update
          sudo pkg upgrade -y
          sudo pkg install -y erlang-runtime${{ matrix.erlang }} ca_root_nss gmake git

          git config --global safe.directory '*'
          export PATH=/usr/local/lib/erlang${{ matrix.erlang }}/bin:$PATH
          erl -sname init_cookie -run erlang halt

          gmake -k ci-setup tests USE_NODETOOL=1

    - name: Upload logs
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Common Test logs (${{ matrix.erlang }} ${{ matrix.os }})
        path: |
          logs/
#          !logs/**/log_private
